services:
  calcops:
    image: tingdulal/calcops:${IMAGE_TAG:-latest}
    environment:
      SERVER_PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calcops:
        condition: service_healthy
    restart: unless-stopped
