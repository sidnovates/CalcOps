services:
  calcops:
    image: tingdulal/calcops:${IMAGE_TAG:-latest}
    environment:
      SERVER_PORT: "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - calcops-network

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calcops:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - calcops-network

networks:
  calcops-network:
    driver: bridge
